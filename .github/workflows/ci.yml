name: CI

on:
  push:
    branches: [main]
  pull_request:

# O GITHUB_TOKEN só precisa ler o código (checkout).
permissions:
  contents: read

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
